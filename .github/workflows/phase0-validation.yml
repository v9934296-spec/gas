name: Phase 0 Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  phase0-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Phase 0 trust gates
        run: npm run validate:phase0
